name: Diagnostico XM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar XM
        run: python diagnostico.py
      - name: Guardar el resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add diagnostico.txt
          git diff --staged --quiet || git commit -m "Diagnostico XM"
          git push
